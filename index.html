<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة الجودة FMEA | Kahve Fabrikası Kalite Yönetimi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
          },
          colors: {
            coffee: {
              950: '#1C110C',
              900: '#2C1A12',
              800: '#42281C',
              700: '#5C3A28',
              600: '#7A4F38',
              100: '#F5ECE6',
              50: '#FAF6F3',
            },
            amberroast: {
              500: '#D97706',
              600: '#B45309',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #FAF6F3;
      color: #1C1917;
    }
    .modal-backdrop {
      background-color: rgba(28, 17, 12, 0.65);
      backdrop-filter: blur(2px);
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #FFFFFF !important;
      }
      .print-header {
        display: block !important;
      }
      .shadow-sm, .shadow-md, .shadow-lg {
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Print Header (Visible only when printing) -->
  <div id="print-header" class="hidden print-header border-b-2 border-coffee-900 pb-4 mb-6 px-6 pt-4">
    <div class="flex justify-between items-start">
      <div>
        <h1 id="print-factory-name" class="text-2xl font-extrabold text-coffee-950"></h1>
        <p id="print-system-sub" class="text-sm text-stone-600 mt-1"></p>
        <p class="text-xs font-bold text-amberroast-600 mt-1">Gıda Mühendisi | Muhammed Abdulmünim</p>
      </div>
      <div class="text-end text-xs text-stone-600">
        <div id="print-date-label" class="font-bold"></div>
        <div id="print-date-val" class="mt-1"></div>
      </div>
    </div>
  </div>

  <!-- Top Hero & Control Bar -->
  <header class="bg-gradient-to-l from-coffee-950 via-coffee-900 to-coffee-800 text-white shadow-lg no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
        <div class="flex items-start gap-4">
          <div class="w-14 h-14 rounded-2xl bg-amberroast-500/20 border border-amberroast-500/40 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-mug-hot text-2xl text-amber-400"></i>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h1 id="factory-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight"></h1>
              <button onclick="openFactoryModal()" id="edit-factory-btn" class="text-xs bg-white/10 hover:bg-white/20 text-amber-200 px-2.5 py-1 rounded-lg transition cursor-pointer" title="تعديل اسم المعمل">
                <i class="fa-solid fa-pen"></i>
              </button>
            </div>
            <p id="factory-subtitle" class="text-coffee-100 text-sm mt-1"></p>
            <!-- Fixed Engineer Signature Card -->
            <div class="mt-2.5 inline-flex items-center gap-2 bg-amberroast-500/20 border border-amber-400/40 text-amber-200 px-3 py-1 rounded-xl text-xs font-bold">
              <i class="fa-solid fa-user-check text-amber-400"></i>
              <span>Gıda Mühendisi | Muhammed Abdulmünim</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons & Language Switcher -->
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="toggleLanguage()" id="lang-toggle-btn" class="bg-amberroast-500 hover:bg-amberroast-600 text-white font-bold text-xs sm:text-sm px-3.5 py-2.5 rounded-xl shadow transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-language text-base"></i>
            <span id="lang-toggle-label">Türkçe</span>
          </button>
          <button onclick="exportToExcel()" id="btn-excel" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-file-excel"></i>
            <span id="label-excel">تصدير Excel</span>
          </button>
          <button onclick="window.print()" id="btn-print" class="bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-print"></i>
            <span id="label-print">طباعة A4</span>
          </button>
          <button onclick="backupJSON()" id="btn-backup" class="bg-amberroast-500/90 hover:bg-amberroast-600 text-white text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-download"></i>
            <span id="label-backup">حفظ نسخة</span>
          </button>
          <label id="btn-restore" class="bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-upload"></i>
            <span id="label-restore">استعادة</span>
            <input type="file" id="restore-file-input" accept=".json" class="hidden" onchange="restoreJSON(event)" />
          </label>
          <button onclick="resetDemoData()" id="btn-reset" class="bg-rose-900/70 hover:bg-rose-800 text-rose-100 text-xs sm:text-sm font-semibold px-3 py-2.5 rounded-xl transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-rotate-left"></i>
            <span id="label-reset">إعادة ضبط</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6 flex-1">

    <!-- KPI Summary Cards -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 no-print">
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-stone-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p id="kpi-total-label" class="text-xs sm:text-sm font-semibold text-stone-500"></p>
          <p id="kpi-total-fmea" class="text-2xl sm:text-3xl font-extrabold text-coffee-900 mt-1">0</p>
        </div>
        <div class="w-11 h-11 rounded-xl bg-coffee-100 text-coffee-800 flex items-center justify-center text-lg">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-stone-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p id="kpi-high-label" class="text-xs sm:text-sm font-semibold text-stone-500"></p>
          <p id="kpi-high-rpn" class="text-2xl sm:text-3xl font-extrabold text-red-600 mt-1">0</p>
        </div>
        <div class="w-11 h-11 rounded-xl bg-red-50 text-red-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-stone-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p id="kpi-open-label" class="text-xs sm:text-sm font-semibold text-stone-500"></p>
          <p id="kpi-open-incidents" class="text-2xl sm:text-3xl font-extrabold text-amberroast-600 mt-1">0</p>
        </div>
        <div class="w-11 h-11 rounded-xl bg-amber-50 text-amberroast-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-bug"></i>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-stone-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p id="kpi-verify-label" class="text-xs sm:text-sm font-semibold text-stone-500"></p>
          <p id="kpi-pending-verification" class="text-2xl sm:text-3xl font-extrabold text-blue-700 mt-1">0</p>
        </div>
        <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center text-lg">
          <i class="fa-solid fa-clipboard-check"></i>
        </div>
      </div>
    </section>

    <!-- Navigation Tabs -->
    <section class="bg-white rounded-2xl p-2 border border-stone-200/80 shadow-sm flex flex-wrap gap-2 no-print">
      <button onclick="switchTab('fmea')" id="tab-fmea" class="tab-btn flex-1 min-w-[160px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-pointer bg-coffee-900 text-white shadow">
        <i class="fa-solid fa-list-check"></i>
        <span id="tab-fmea-label"></span>
      </button>
      <button onclick="switchTab('incidents')" id="tab-incidents" class="tab-btn flex-1 min-w-[160px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-pointer text-stone-600 hover:bg-stone-100">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="tab-incidents-label"></span>
        <span id="open-incidents-badge" class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
      <button onclick="switchTab('stages')" id="tab-stages" class="tab-btn flex-1 min-w-[160px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition cursor-pointer text-stone-600 hover:bg-stone-100">
        <i class="fa-solid fa-sliders"></i>
        <span id="tab-stages-label"></span>
      </button>
    </section>

    <!-- TAB 1: LIVE FMEA REGISTER -->
    <section id="view-fmea" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 border border-stone-200/80 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 no-print">
        <div class="flex flex-col sm:flex-row gap-3 flex-1">
          <div class="relative flex-1">
            <i id="search-icon-pos" class="fa-solid fa-magnifying-glass absolute top-3.5 text-stone-400 text-sm"></i>
            <input type="text" id="fmea-search" oninput="renderFMEA()" class="w-full py-2.5 rounded-xl border border-stone-300 focus:border-coffee-700 focus:ring-2 focus:ring-coffee-700/20 outline-none text-sm" />
          </div>
          <select id="fmea-stage-filter" onchange="renderFMEA()" class="px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-coffee-700 outline-none text-sm bg-white">
          </select>
          <select id="fmea-risk-filter" onchange="renderFMEA()" class="px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-coffee-700 outline-none text-sm bg-white">
          </select>
        </div>
        <button onclick="openFMEAModal()" class="bg-amberroast-500 hover:bg-amberroast-600 text-white font-bold text-sm px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2 shrink-0 cursor-pointer">
          <i class="fa-solid fa-plus"></i>
          <span id="add-fmea-btn-label"></span>
        </button>
      </div>

      <div class="bg-white rounded-2xl border border-stone-200/80 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-coffee-950 text-white text-xs">
              <tr id="fmea-table-head"></tr>
            </thead>
            <tbody id="fmea-table-body" class="divide-y divide-stone-200"></tbody>
          </table>
        </div>
      </div>

      <div id="fmea-legend-box" class="bg-amber-50/80 border border-amber-200 rounded-2xl p-4 text-xs text-stone-700 flex flex-wrap items-center justify-between gap-2 no-print"></div>
    </section>

    <!-- TAB 2: COMPLAINTS & PRODUCTION FAULTS (8D) -->
    <section id="view-incidents" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 border border-stone-200/80 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print">
        <div>
          <h2 id="incidents-section-title" class="text-lg font-extrabold text-coffee-950"></h2>
          <p id="incidents-section-desc" class="text-xs text-stone-500 mt-0.5"></p>
        </div>
        <button onclick="openIncidentModal()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-2 shrink-0 cursor-pointer">
          <i class="fa-solid fa-plus-circle"></i>
          <span id="add-incident-btn-label"></span>
        </button>
      </div>

      <div id="incidents-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- TAB 3: PRODUCTION STAGES & SETTINGS -->
    <section id="view-stages" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-stone-200/80 shadow-sm space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-stone-100 pb-4">
          <div>
            <h2 id="stages-section-title" class="text-lg font-extrabold text-coffee-950"></h2>
            <p id="stages-section-desc" class="text-xs text-stone-500 mt-0.5"></p>
          </div>
          <div class="flex gap-2 no-print">
            <input type="text" id="new-stage-input" class="px-3.5 py-2 rounded-xl border border-stone-300 focus:border-coffee-700 outline-none text-sm" />
            <button onclick="addStage()" class="bg-coffee-800 hover:bg-coffee-900 text-white font-bold text-sm px-4 py-2 rounded-xl transition flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-plus"></i>
              <span id="add-stage-btn-label"></span>
            </button>
          </div>
        </div>
        <div id="stages-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </div>
    </section>

  </main>

  <!-- MODAL 1: ADD / EDIT FMEA ITEM -->
  <div id="fmea-modal" class="fixed inset-0 z-50 hidden modal-backdrop items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-stone-200 my-8">
      <div class="flex items-center justify-between border-b border-stone-200 pb-3 mb-4">
        <h3 id="fmea-modal-title" class="text-lg font-extrabold text-coffee-950"></h3>
        <button onclick="closeFMEAModal()" class="text-stone-400 hover:text-stone-700 text-xl cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="fmea-form" onsubmit="saveFMEA(event)" class="space-y-4 text-sm">
        <input type="hidden" id="fmea-id" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-fmea-stage" class="block font-bold text-stone-700 mb-1"></label>
            <select id="fmea-stage" required class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"></select>
          </div>
          <div>
            <label id="lbl-fmea-failure" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-failure" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-fmea-effect" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-effect" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-fmea-cause" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-cause" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-fmea-control" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-control" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-fmea-action" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-rec-action" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
        </div>

        <!-- SOD Scores -->
        <div class="bg-stone-50 p-4 rounded-xl border border-stone-200">
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label id="lbl-fmea-s" class="block text-xs font-bold text-stone-700 mb-1"></label>
              <input type="number" id="fmea-s" min="1" max="10" value="7" required oninput="updateModalRPNPreview()" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white text-center font-bold" />
            </div>
            <div>
              <label id="lbl-fmea-o" class="block text-xs font-bold text-stone-700 mb-1"></label>
              <input type="number" id="fmea-o" min="1" max="10" value="5" required oninput="updateModalRPNPreview()" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white text-center font-bold" />
            </div>
            <div>
              <label id="lbl-fmea-d" class="block text-xs font-bold text-stone-700 mb-1"></label>
              <input type="number" id="fmea-d" min="1" max="10" value="4" required oninput="updateModalRPNPreview()" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white text-center font-bold" />
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-stone-200 flex items-center justify-between">
            <span id="lbl-fmea-rpn-preview" class="text-xs font-bold text-stone-600"></span>
            <span id="fmea-rpn-preview" class="text-lg font-extrabold px-3 py-1 rounded-lg bg-amber-100 text-amber-900">140</span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-fmea-owner" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="fmea-owner" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-fmea-status" class="block font-bold text-stone-700 mb-1"></label>
            <select id="fmea-status" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"></select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-stone-200">
          <button type="button" onclick="closeFMEAModal()" id="btn-cancel-fmea" class="px-4 py-2 rounded-xl border border-stone-300 text-stone-700 font-semibold hover:bg-stone-50 cursor-pointer"></button>
          <button type="submit" id="btn-save-fmea" class="px-5 py-2 rounded-xl bg-coffee-900 hover:bg-coffee-800 text-white font-bold cursor-pointer"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: ADD / EDIT COMPLAINT OR PRODUCTION FAULT (8D) -->
  <div id="incident-modal" class="fixed inset-0 z-50 hidden modal-backdrop items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-stone-200 my-8">
      <div class="flex items-center justify-between border-b border-stone-200 pb-3 mb-4">
        <h3 id="incident-modal-title" class="text-lg font-extrabold text-coffee-950"></h3>
        <button onclick="closeIncidentModal()" class="text-stone-400 hover:text-stone-700 text-xl cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
            <form id="incident-form" onsubmit="saveIncident(event)" class="space-y-4 text-sm">
        <input type="hidden" id="inc-id" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-inc-source" class="block font-bold text-stone-700 mb-1"></label>
            <select id="inc-source" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"></select>
          </div>
          <div>
            <label id="lbl-inc-fmea" class="block font-bold text-stone-700 mb-1"></label>
            <select id="inc-fmea-id" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"></select>
            <p id="inc-fmea-hint" class="text-[11px] text-amberroast-600 mt-1"></p>
          </div>
        </div>

        <div>
          <label id="lbl-inc-desc" class="block font-bold text-stone-700 mb-1"></label>
          <textarea id="inc-desc" rows="2" required class="w-full px-3 py-2 rounded-xl border border-stone-300"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label id="lbl-inc-batch" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="inc-batch" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-inc-root" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="inc-root-cause" class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
        </div>

        <div>
          <label id="lbl-inc-corrective" class="block font-bold text-stone-700 mb-1"></label>
          <input type="text" id="inc-corrective" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label id="lbl-inc-owner" class="block font-bold text-stone-700 mb-1"></label>
            <input type="text" id="inc-owner" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-inc-due" class="block font-bold text-stone-700 mb-1"></label>
            <input type="date" id="inc-due" required class="w-full px-3 py-2 rounded-xl border border-stone-300" />
          </div>
          <div>
            <label id="lbl-inc-status" class="block font-bold text-stone-700 mb-1"></label>
            <select id="inc-status" onchange="handleIncidentStatusChange()" class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"></select>
          </div>
        </div>

        <!-- Mandatory Effectiveness Verification Gate -->
        <div id="verification-box" class="bg-blue-50/80 border border-blue-200 rounded-xl p-4 space-y-2">
          <label class="flex items-start gap-2.5 cursor-pointer">

            status: 'Doğrulama Bekliyor',
            verified: false,
            verificationNote: 'İki parti denendi, üçüncü parti kontrol ediliyor.'
          }
        ]
      }
    };

    function getSeedData(lang) {
      const t = I18N[lang];
      return {
        lang,
        factoryName: t.defaultFactoryName,
        stages: [...t.defaultStages],
        fmeaItems: JSON.parse(JSON.stringify(t.defaultFmea)),
        incidents: JSON.parse(JSON.stringify(t.defaultIncidents))
      };
    }

    let state = loadState();
    let currentTab = 'fmea';

    function t() {
      return I18N[state.lang] || I18N.ar;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.fmeaItems && parsed.incidents && parsed.stages) {
            parsed.lang = parsed.lang === 'tr' ? 'tr' : 'ar';
            return parsed;
          }
        }
      } catch (e) {
        console.error(e);
      }
      return getSeedData('ar');
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
    }

    function toggleLanguage() {
      const nextLang = state.lang === 'ar' ? 'tr' : 'ar';
      const oldLang = state.lang;
      const oldDefaultName = I18N[oldLang].defaultFactoryName;
      const newSeed = getSeedData(nextLang);

      const wasUntouchedDemo =
        state.factoryName === oldDefaultName &&
        JSON.stringify(state.stages) === JSON.stringify(I18N[oldLang].defaultStages) &&
        state.fmeaItems.length === I18N[oldLang].defaultFmea.length &&
        state.incidents.length === I18N[oldLang].defaultIncidents.length;

      if (wasUntouchedDemo) {
        state = newSeed;
      } else {
        state.lang = nextLang;
        if (state.factoryName === oldDefaultName) {
          state.factoryName = I18N[nextLang].defaultFactoryName;
        }
      }
      saveState();
    }

    function calcRPN(item) {
      return Number(item.s || 1) * Number(item.o || 1) * Number(item.d || 1);
    }

    function getRPNBadge(rpn) {
      if (rpn >= 100) {
        return `<span class="inline-block px-2.5 py-1 rounded-lg font-extrabold text-xs bg-red-100 text-red-700 border border-red-200">${rpn}</span>`;
      }
      if (rpn >= 50) {
        return `<span class="inline-block px-2.5 py-1 rounded-lg font-extrabold text-xs bg-amber-100 text-amber-800 border border-amber-200">${rpn}</span>`;
      }
      return `<span class="inline-block px-2.5 py-1 rounded-lg font-extrabold text-xs bg-emerald-100 text-emerald-700 border border-emerald-200">${rpn}</span>`;
    }

    function getStatusBadge(status) {
      const tr = t();
      const map = {
        [tr.statusOpen]: 'bg-red-50 text-red-700 border-red-200',
        [tr.statusInProgress]: 'bg-amber-50 text-amber-800 border-amber-200',
        [tr.statusPendingVer]: 'bg-blue-50 text-blue-700 border-blue-200',
        [tr.statusClosed]: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'مفتوح': 'bg-red-50 text-red-700 border-red-200',
        'قيد التنفيذ': 'bg-amber-50 text-amber-800 border-amber-200',
        'بانتظار التحقق': 'bg-blue-50 text-blue-700 border-blue-200',
        'مغلق': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        'Açık': 'bg-red-50 text-red-700 border-red-200',
        'Devam Ediyor': 'bg-amber-50 text-amber-800 border-amber-200',
        'Doğrulama Bekliyor': 'bg-blue-50 text-blue-700 border-blue-200',
        'Kapalı': 'bg-emerald-50 text-emerald-700 border-emerald-200'
      };
      const cls = map[status] || 'bg-stone-100 text-stone-700 border-stone-200';
      return `<span class="inline-block px-2.5 py-1 rounded-full text-xs font-bold border ${cls}">${escapeHtml(status)}</span>`;
    }

    function isClosedStatus(status) {
      return status === 'مغلق' || status === 'Kapalı';
    }

    function renderKPIs() {
      const totalFmea = state.fmeaItems.length;
      const highRpn = state.fmeaItems.filter(i => calcRPN(i) >= 100).length;
      const openIncidents = state.incidents.filter(i => !isClosedStatus(i.status)).length;
      const pendingVer = state.incidents.filter(i => !i.verified && !isClosedStatus(i.status)).length;

      document.getElementById('kpi-total-fmea').textContent = totalFmea;
      document.getElementById('kpi-high-rpn').textContent = highRpn;
      document.getElementById('kpi-open-incidents').textContent = openIncidents;
      document.getElementById('kpi-pending-verification').textContent = pendingVer;
      document.getElementById('open-incidents-badge').textContent = openIncidents;
    }

    function populateFilterDropdowns() {
      const tr = t();
      const stageFilter = document.getElementById('fmea-stage-filter');
      const currentStageVal = stageFilter.value;
      stageFilter.innerHTML = `<option value="ALL">${tr.allStages}</option>` +
        state.stages.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
      if ([...stageFilter.options].some(o => o.value === currentStageVal)) {
        stageFilter.value = currentStageVal;
      }

      const riskFilter = document.getElementById('fmea-risk-filter');
      const currentRiskVal = riskFilter.value;
      riskFilter.innerHTML = `
        <option value="ALL">${tr.allRisks}</option>
        <option value="HIGH">${tr.riskHigh}</option>
        <option value="MED">${tr.riskMed}</option>
        <option value="LOW">${tr.riskLow}</option>
      `;
      if (currentRiskVal) riskFilter.value = currentRiskVal;
    }

    function renderFMEA() {
      const tr = t();
      const q = (document.getElementById('fmea-search').value || '').trim().toLowerCase();
      const stageFilter = document.getElementById('fmea-stage-filter').value;
      const riskFilter = document.getElementById('fmea-risk-filter').value;

      const filtered = state.fmeaItems
        .map(item => ({ ...item, rpn: calcRPN(item) }))
        .filter(item => {
          const matchesStage = stageFilter === 'ALL' || item.stage === stageFilter;
          const matchesRisk =
            riskFilter === 'ALL' ||
            (riskFilter === 'HIGH' && item.rpn >= 100) ||
            (riskFilter === 'MED' && item.rpn >= 50 && item.rpn < 100) ||
            (riskFilter === 'LOW' && item.rpn < 50);
          const hay = `${item.stage} ${item.failure}${item.effect} ${item.cause}${item.control} ${item.recAction}${item.owner}`.toLowerCase();
          const matchesQuery = !q || hay.includes(q);
          return matchesStage && matchesRisk && matchesQuery;
        })
        .sort((a, b) => b.rpn - a.rpn);

      const tbody = document.getElementById('fmea-table-body');
      tbody.innerHTML = filtered.map(item => `
        <tr class="hover:bg-coffee-50/60 transition align-top">
          <td class="py-3 px-3 font-bold text-coffee-900 whitespace-nowrap">${escapeHtml(item.stage)}</td>
          <td class="py-3 px-3 font-semibold text-stone-900">${escapeHtml(item.failure)}</td>
          <td class="py-3 px-3 text-stone-600">${escapeHtml(item.effect)}</td>
          <td class="py-3 px-3 text-stone-600">${escapeHtml(item.cause)}</td>
          <td class="py-3 px-3 text-stone-600">${escapeHtml(item.control || '-')}</td>
          <td class="py-3 px-2 text-center font-bold">${item.s}</td>
          <td class="py-3 px-2 text-center font-bold text-amberroast-600">${item.o}</td>
          <td class="py-3 px-2 text-center font-bold">${item.d}</td>
          <td class="py-3 px-3 text-center">${getRPNBadge(item.rpn)}</td>
          <td class="py-3 px-3">
            <div class="text-stone-800 font-medium">${escapeHtml(item.recAction || '-')}</div>
            <div class="text-xs text-stone-500 mt-0.5"><i class="fa-solid fa-user"></i> ${escapeHtml(item.owner || tr.ownerFallback)}</div>
          </td>
          <td class="py-3 px-3 text-center whitespace-nowrap">${getStatusBadge(item.status)}</td>
          <td class="py-3 px-3 text-center whitespace-nowrap no-print">
            <button onclick="openFMEAModal('${item.id}')" class="text-coffee-800 hover:text-amberroast-600 p-1.5 cursor-pointer" title="${tr.editBtn}">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteFMEA('${item.id}')" class="text-red-600 hover:text-red-800 p-1.5 cursor-pointer" title="${tr.deleteBtn}">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderIncidents() {
      const tr = t();
      const container = document.getElementById('incidents-list');
      container.innerHTML = state.incidents.map(inc => {
        const linkedFmea = state.fmeaItems.find(f => f.id === inc.fmeaId);
        const linkedRpn = linkedFmea ? calcRPN(linkedFmea) : null;
        return `
          <div class="bg-white rounded-2xl p-5 border border-stone-200/90 shadow-sm flex flex-col justify-between gap-4">
            <div class="space-y-2.5">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-coffee-100 text-coffee-900">
                  <i class="fa-solid fa-tag"></i> ${escapeHtml(inc.source)}
                </span>
                ${getStatusBadge(inc.status)}
              </div>

              <p class="font-bold text-stone-900 text-base">${escapeHtml(inc.description)}</p>

              <div class="text-xs text-stone-600 space-y-1 bg-stone-50 p-3 rounded-xl border border-stone-100">
                <div><strong>${tr.batchLabel}:</strong>${escapeHtml(inc.batch || '-')}</div>
                <div><strong>${tr.rootLabel}:</strong>${escapeHtml(inc.rootCause || '-')}</div>
                <div><strong>${tr.actionLabel}:</strong>${escapeHtml(inc.correctiveAction)}</div>
                <div><strong>${tr.lblIncOwner}:</strong>${escapeHtml(inc.owner)} | <strong>${tr.dueLabel}:</strong>${escapeHtml(inc.dueDate)}</div>
              </div>

              ${linkedFmea ? `
                <div class="text-xs bg-amber-50/90 border border-amber-200 text-amber-950 px-3 py-2 rounded-xl flex items-center justify-between gap-2">
                  <span class="truncate"><i class="fa-solid fa-link"></i> FMEA: <strong>${escapeHtml(linkedFmea.failure)}</strong></span>
                  <span class="font-extrabold shrink-0">RPN: ${linkedRpn} (O=${linkedFmea.o})</span>
                </div>
              ` : ''}
            </div>

            <div class="pt-3 border-t border-stone-100 flex items-center justify-between gap-2 flex-wrap">
              <span class="text-xs font-bold ${inc.verified ? 'text-emerald-700' : 'text-stone-400'}">
                <i class="fa-solid ${inc.verified ? 'fa-circle-check' : 'fa-clock'}"></i>
                ${inc.verified ? tr.verifiedBadge : tr.unverifiedBadge}
              </span>
              <div class="flex items-center gap-2 no-print">
                <button onclick="openIncidentModal('${inc.id}')" class="text-xs font-bold bg-coffee-100 hover:bg-coffee-200 text-coffee-900 px-3 py-1.5 rounded-lg transition cursor-pointer">
                  ${tr.editBtn}
                </button>
                <button onclick="deleteIncident('${inc.id}')" class="text-xs font-bold bg-red-50 hover:bg-red-100 text-red-700 px-3 py-1.5 rounded-lg transition cursor-pointer">
                  ${tr.deleteBtn}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStages() {
      const tr = t();
      const container = document.getElementById('stages-list');
      container.innerHTML = state.stages.map((stage, idx) => `
        <div class="flex items-center justify-between bg-coffee-50 border border-coffee-100 rounded-xl px-4 py-3">
          <div class="flex items-center gap-2.5">
            <span class="w-6 h-6 rounded-full bg-coffee-900 text-white text-xs font-bold flex items-center justify-center">${idx + 1}</span>
            <span class="font-bold text-sm text-coffee-950">${escapeHtml(stage)}</span>
          </div>
          <button onclick="deleteStage(${idx})" class="text-red-500 hover:text-red-700 text-sm p-1 no-print cursor-pointer" title="${tr.deleteBtn}">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function renderAll() {
      applyLanguageDirectionAndLabels();
      populateFilterDropdowns();
      renderKPIs();
      renderFMEA();
      renderIncidents();
      renderStages();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['fmea', 'incidents', 'stages'].forEach(name => {
        document.getElementById(`view-${name}`).classList.toggle('hidden', name !== tab); const btn = document.getElementById(`tab-${name}`);
        if (name === tab) {
          btn.classList.add('bg-coffee-900', 'text-white', 'shadow');
          btn.classList.remove('text-stone-600', 'hover:bg-stone-100');
        } else {
          btn.classList.remove('bg-coffee-900', 'text-white', 'shadow');
          btn.classList.add('text-stone-600', 'hover:bg-stone-100');
        }
      });
    }

    function getStatusOptionsHtml(selectedVal) {
      const tr = t();
      const opts = [tr.statusOpen, tr.statusInProgress, tr.statusPendingVer, tr.statusClosed];
      return opts.map(o => `<option value="${escapeAttr(o)}" ${o === selectedVal ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
    }

    function openFMEAModal(id = null) {
      const tr = t();
      const modal = document.getElementById('fmea-modal');
      const stageSelect = document.getElementById('fmea-stage');
      stageSelect.innerHTML = state.stages.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');

      if (id) {
        const item = state.fmeaItems.find(x => x.id === id);
        if (!item) return;
        document.getElementById('fmea-modal-title').textContent = tr.fmeaModalEdit;
        document.getElementById('fmea-id').value = item.id;
        stageSelect.value = item.stage;
        document.getElementById('fmea-failure').value = item.failure;
        document.getElementById('fmea-effect').value = item.effect;
        document.getElementById('fmea-cause').value = item.cause;
        document.getElementById('fmea-control').value = item.control || '';
        document.getElementById('fmea-rec-action').value = item.recAction || '';
        document.getElementById('fmea-s').value = item.s;
        document.getElementById('fmea-o').value = item.o;
        document.getElementById('fmea-d').value = item.d;
        document.getElementById('fmea-owner').value = item.owner || '';
        document.getElementById('fmea-status').innerHTML = getStatusOptionsHtml(item.status);
      } else {
        document.getElementById('fmea-modal-title').textContent = tr.fmeaModalAdd;
        document.getElementById('fmea-id').value = '';
        document.getElementById('fmea-form').reset();
        document.getElementById('fmea-s').value = 7;
        document.getElementById('fmea-o').value = 5;
        document.getElementById('fmea-d').value = 4;
        document.getElementById('fmea-status').innerHTML = getStatusOptionsHtml(tr.statusOpen);
      }

      updateModalRPNPreview();
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeFMEAModal() {
      const modal = document.getElementById('fmea-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function updateModalRPNPreview() {
      const s = Math.min(10, Math.max(1, Number(document.getElementById('fmea-s').value) || 1));
      const o = Math.min(10, Math.max(1, Number(document.getElementById('fmea-o').value) || 1));
      const d = Math.min(10, Math.max(1, Number(document.getElementById('fmea-d').value) || 1));
      const rpn = s * o * d;
      const badge = document.getElementById('fmea-rpn-preview');
      badge.textContent = rpn;
      if (rpn >= 100) {
        badge.className = 'text-lg font-extrabold px-3 py-1 rounded-lg bg-red-100 text-red-700';
      } else if (rpn >= 50) {
        badge.className = 'text-lg font-extrabold px-3 py-1 rounded-lg bg-amber-100 text-amber-800';
      } else {
        badge.className = 'text-lg font-extrabold px-3 py-1 rounded-lg bg-emerald-100 text-emerald-700';
      }
    }

    function saveFMEA(e) {
      e.preventDefault();
      const id = document.getElementById('fmea-id').value;
      const payload = {
        id: id || ('fmea-' + Date.now()),
        stage: document.getElementById('fmea-stage').value,
        failure: document.getElementById('fmea-failure').value.trim(),
        effect: document.getElementById('fmea-effect').value.trim(),
        cause: document.getElementById('fmea-cause').value.trim(),
        control: document.getElementById('fmea-control').value.trim(),
        recAction: document.getElementById('fmea-rec-action').value.trim(),
        s: Math.min(10, Math.max(1, Number(document.getElementById('fmea-s').value) || 1)),
        o: Math.min(10, Math.max(1, Number(document.getElementById('fmea-o').value) || 1)),
        d: Math.min(10, Math.max(1, Number(document.getElementById('fmea-d').value) || 1)),
        owner: document.getElementById('fmea-owner').value.trim(),
        status: document.getElementById('fmea-status').value
      };

      if (id) {
        const idx = state.fmeaItems.findIndex(x => x.id === id);
        if (idx !== -1) state.fmeaItems[idx] = payload;
      } else {
        state.fmeaItems.unshift(payload);
      }

      closeFMEAModal();
      saveState();
    }

    function deleteFMEA(id) {
      if (!confirm(t().confirmDeleteItem)) return;
      state.fmeaItems = state.fmeaItems.filter(x => x.id !== id);
      saveState();
    }

    function openIncidentModal(id = null) {
      const tr = t();
      const modal = document.getElementById('incident-modal');

      document.getElementById('inc-source').innerHTML = `
        <option value="${escapeAttr(tr.srcComplaint)}">${escapeHtml(tr.srcComplaint)}</option>
        <option value="${escapeAttr(tr.srcProduction)}">${escapeHtml(tr.srcProduction)}</option>
        <option value="${escapeAttr(tr.srcQc)}">${escapeHtml(tr.srcQc)}</option>
      `;

      document.getElementById('inc-fmea-id').innerHTML =
        `<option value="">${tr.noLinkFmea}</option>` +
        state.fmeaItems.map(f => `<option value="${escapeAttr(f.id)}">[${escapeHtml(f.stage)}] ${escapeHtml(f.failure)} (RPN:${calcRPN(f)})</option>`).join('');

      document.getElementById('verification-warning').classList.add('hidden');

      if (id) {
        const inc = state.incidents.find(x => x.id === id);
        if (!inc) return;
        document.getElementById('incident-modal-title').textContent = tr.incModalEdit;
        document.getElementById('inc-id').value = inc.id;
        document.getElementById('inc-source').value = inc.source;
        document.getElementById('inc-fmea-id').value = inc.fmeaId || '';
        document.getElementById('inc-desc').value = inc.description;
        document.getElementById('inc-batch').value = inc.batch || '';
        document.getElementById('inc-root-cause').value = inc.rootCause || '';
        document.getElementById('inc-corrective').value = inc.correctiveAction;
        document.getElementById('inc-owner').value = inc.owner;
        document.getElementById('inc-due').value = inc.dueDate;
        document.getElementById('inc-status').innerHTML = getStatusOptionsHtml(inc.status);
        document.getElementById('inc-verified').checked = Boolean(inc.verified);
        document.getElementById('inc-verification-note').value = inc.verificationNote || '';
      } else {
        document.getElementById('incident-modal-title').textContent = tr.incModalAdd;
        document.getElementById('inc-id').value = '';
        document.getElementById('incident-form').reset();
        document.getElementById('inc-status').innerHTML = getStatusOptionsHtml(tr.statusOpen);
        document.getElementById('inc-due').value = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
        document.getElementById('inc-verified').checked = false;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeIncidentModal() {
      const modal = document.getElementById('incident-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleIncidentStatusChange() {
      const statusVal = document.getElementById('inc-status').value;
      const verified = document.getElementById('inc-verified').checked;
      const warn = document.getElementById('verification-warning');
      if (isClosedStatus(statusVal) && !verified) {
        warn.classList.remove('hidden');
        return false;
      }
      warn.classList.add('hidden');
      return true;
    }

    function saveIncident(e) {
      e.preventDefault();
      if (!handleIncidentStatusChange()) return;

      const id = document.getElementById('inc-id').value;
      const linkedFmeaId = document.getElementById('inc-fmea-id').value || null;

      if (!id && linkedFmeaId) {
        const fmeaTarget = state.fmeaItems.find(f => f.id === linkedFmeaId);
        if (fmeaTarget) {
          fmeaTarget.o = Math.min(10, Number(fmeaTarget.o || 1) + 1);
        }
      }

      const payload = {
        id: id || ('inc-' + Date.now()),
        source: document.getElementById('inc-source').value,
        fmeaId: linkedFmeaId,
        description: document.getElementById('inc-desc').value.trim(),
        batch: document.getElementById('inc-batch').value.trim(),
        rootCause: document.getElementById('inc-root-cause').value.trim(),
        correctiveAction: document.getElementById('inc-corrective').value.trim(),
        owner: document.getElementById('inc-owner').value.trim(),
        dueDate: document.getElementById('inc-due').value,
        status: document.getElementById('inc-status').value,
        verified: document.getElementById('inc-verified').checked,
        verificationNote: document.getElementById('inc-verification-note').value.trim()
      };

      if (id) {
        const idx = state.incidents.findIndex(x => x.id === id);
        if (idx !== -1) state.incidents[idx] = payload;
      } else {
        state.incidents.unshift(payload);
      }

      closeIncidentModal();
      saveState();
    }

    function deleteIncident(id) {
      if (!confirm(t().confirmDeleteItem)) return;
      state.incidents = state.incidents.filter(x => x.id !== id);
      saveState();
    }

    function addStage() {
      const input = document.getElementById('new-stage-input');
      const val = input.value.trim();
      if (!val) return;
      if (state.stages.includes(val)) {
        alert(t().alertStageExists);
        return;
      }
      state.stages.push(val);
      input.value = '';
      saveState();
    }

    function deleteStage(idx) {
      if (!confirm(t().confirmDeleteStage)) return;
      state.stages.splice(idx, 1);
      saveState();
    }

    function openFactoryModal() {
      document.getElementById('factory-name-input').value = state.factoryName;
      const modal = document.getElementById('factory-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeFactoryModal() {
      const modal = document.getElementById('factory-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveFactoryName() {
      const val = document.getElementById('factory-name-input').value.trim();
      if (val) {
        state.factoryName = val;
        saveState();
      }
      closeFactoryModal();
    }

    function exportToExcel() {
      const tr = t();
      const rows = [
        [tr.thStage, tr.thFailure, tr.thEffect, tr.thCause, tr.thControl, tr.thS, tr.thO, tr.thD, tr.thRpn, tr.thAction, tr.lblOwner, tr.thStatus],
        ...state.fmeaItems.map(i => [
          i.stage, i.failure, i.effect, i.cause, i.control || '',
          i.s, i.o, i.d, calcRPN(i), i.recAction || '', i.owner || '', i.status
        ])
      ];
      const csvContent = '\uFEFF' + rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n'); const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `coffee-fmea-${state.lang}-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(url); }  function backupJSON() { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `coffee-fmea-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.fmeaItems || !parsed.incidents || !parsed.stages) {
            alert(t().alertInvalidJson);
            return;
          }
          parsed.lang = parsed.lang === 'tr' ? 'tr' : 'ar';
          state = parsed;
          saveState();
          alert(t().alertRestored);
        } catch (err) {
          alert(t().alertInvalidJson);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetDemoData() {
      if (!confirm(t().confirmReset)) return;
      state = getSeedData(state.lang);
      saveState();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    renderAll();
  </script>
</body>
</html>
