<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FMEA &amp; 8D | نظام إدارة الجودة - معمل القهوة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Cairo', 'Inter', sans-serif; background-color: #f8f5f2; color: #231712; }
  </style>
</head>
<body class="min-h-screen p-4">
  <header class="max-w-6xl mx-auto bg-[#2c1a12] text-white rounded-2xl p-5 shadow flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 id="app-title" class="text-xl font-bold">نظام إدارة الجودة FMEA و 8D — معمل القهوة</h1>
      <p id="engineer-sig" class="text-amber-200 text-sm mt-1">Gıda Mühendisi | Muhammed Abdulmünim</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" id="btn-lang" onclick="toggleLang()" class="bg-amber-500 hover:bg-amber-400 text-stone-950 font-semibold px-4 py-2 rounded-xl text-sm">Türkçe</button>
      <button type="button" onclick="window.print()" class="bg-stone-700 hover:bg-stone-600 px-4 py-2 rounded-xl text-sm">طباعة A4</button>
      <button type="button" id="btn-export" onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm">تصدير Excel</button>
      <button type="button" id="btn-restore" onclick="restoreSample()" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 px-4 py-2 rounded-xl text-sm">استعادة</button>
    </div>
  </header>
    <main class="max-w-6xl mx-auto mt-6 space-y-6">
    <!-- بطاقات المؤشرات -->
    <section id="kpi-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-2xl p-4 shadow border border-stone-200">
        <p id="kpi-total-label" class="text-xs text-stone-500 font-semibold">إجمالي المخاطر (FMEA)</p>
        <p id="kpi-total" class="text-2xl font-bold text-[#2c1a12] mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow border border-stone-200">
        <p id="kpi-high-label" class="text-xs text-stone-500 font-semibold">مخاطر عالية (RPN ≥ 100)</p>
        <p id="kpi-high" class="text-2xl font-bold text-red-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow border border-stone-200">
        <p id="kpi-8d-label" class="text-xs text-stone-500 font-semibold">شكاوى / حالات 8D نشطة</p>
        <p id="kpi-8d" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow border border-stone-200">
        <p id="kpi-avg-label" class="text-xs text-stone-500 font-semibold">متوسط RPN</p>
        <p id="kpi-avg" class="text-2xl font-bold text-emerald-700 mt-1">0</p>
      </div>
    </section>

    <!-- نموذج إدخال FMEA و 8D -->
    <section class="bg-white rounded-2xl p-5 shadow border border-stone-200">
      <h2 id="form-title" class="text-lg font-bold text-[#2c1a12] mb-4">إضافة سجل FMEA / متابعة 8D</h2>
      <form id="fmea-form" onsubmit="addRecord(event)" class="grid grid-cols-1 md:grid-cols-6 gap-3">
        <input id="f-process" type="text" required placeholder="العملية / خط الإنتاج (مثال: التحميص)" class="md:col-span-2 border rounded-xl px-3 py-2 text-sm" />
        <input id="f-mode" type="text" required placeholder="نمط الفشل / الشكوى (8D)" class="md:col-span-2 border rounded-xl px-3 py-2 text-sm" />
        <input id="f-effect" type="text" required placeholder="الأثر على الجودة / العميل" class="md:col-span-2 border rounded-xl px-3 py-2 text-sm" />
        <input id="f-sev" type="number" min="1" max="10" value="5" required placeholder="الشدة (S: 1-10)" class="border rounded-xl px-3 py-2 text-sm" />
        <input id="f-occ" type="number" min="1" max="10" value="5" required placeholder="التكرار (O: 1-10)" class="border rounded-xl px-3 py-2 text-sm" />
        <input id="f-det" type="number" min="1" max="10" value="5" required placeholder="الاكتشاف (D: 1-10)" class="border rounded-xl px-3 py-2 text-sm" />
        <input id="f-action" type="text" placeholder="الإجراء التصحيحي (8D / FMEA)" class="md:col-span-2 border rounded-xl px-3 py-2 text-sm" />
        <button id="btn-add" type="submit" class="bg-[#2c1a12] hover:bg-stone-800 text-white font-semibold rounded-xl px-4 py-2 text-sm">حفظ السجل</button>
      </form>
    </section>

    <!-- جدول السجلات -->
    <section class="bg-white rounded-2xl p-5 shadow border border-stone-200 overflow-x-auto">
      <h2 id="table-title" class="text-lg font-bold text-[#2c1a12] mb-4">سجل FMEA وتقارير 8D</h2>
      <table class="w-full text-sm border-collapse">
        <thead>
          <tr id="table-head" class="bg-stone-100 text-stone-700 border-b">
            <th class="p-2 text-start">#</th>
            <th class="p-2 text-start">العملية</th>
            <th class="p-2 text-start">نمط الفشل / 8D</th>
            <th class="p-2 text-start">الأثر</th>
            <th class="p-2 text-center">S</th>
            <th class="p-2 text-center">O</th>
            <th class="p-2 text-center">D</th>
            <th class="p-2 text-center">RPN</th>
            <th class="p-2 text-start">الإجراء التصحيحي</th>
            <th class="p-2 text-center">حذف</th>
          </tr>
        </thead>
        <tbody id="fmea-tbody" class="divide-y"></tbody>
      </table>
    </section>
  </main>
    <script>
    let lang = 'ar';
    let records = JSON.parse(localStorage.getItem('coffee_fmea_8d_v1') || '[]');

    const i18n = {
      ar: {
        title: 'نظام إدارة الجودة FMEA و 8D — معمل القهوة',
        sig: 'Gıda Mühendisi | Muhammed Abdulmünim',
        toggleBtn: 'Türkçe',
        printBtn: 'طباعة A4',
        exportBtn: 'تصدير Excel',
        restoreBtn: 'استعادة',
        kpiTotal: 'إجمالي المخاطر (FMEA)',
        kpiHigh: 'مخاطر عالية (RPN ≥ 100)',
        kpi8d: 'شكاوى / حالات 8D نشطة',
        kpiAvg: 'متوسط RPN',
        formTitle: 'إضافة سجل FMEA / متابعة 8D',
        phProcess: 'العملية / خط الإنتاج (مثال: التحميص)',
        phMode: 'نمط الفشل / الشكوى (8D)',
        phEffect: 'الأثر على الجودة / العميل',
        phAction: 'الإجراء التصحيحي (8D / FMEA)',
        addBtn: 'حفظ السجل',
        tableTitle: 'سجل FMEA وتقارير 8D',
        delBtn: 'حذف',
        sampleProcess: 'التحميص والتبريد',
        sampleMode: 'تفاوت درجة التحميص (8D)',
        sampleEffect: 'تغير الطعم والرائحة وعدم تجانس الدفعة',
        sampleAction: 'معايرة حساس الحرارة ومراقبة كل دفعة'
      },
      tr: {
        title: 'FMEA ve 8D Kalite Yönetim Sistemi — Kahve Fabrikası',
        sig: 'Gıda Mühendisi | Muhammed Abdulmünim',
        toggleBtn: 'العربية',
        printBtn: 'A4 Yazdır',
        exportBtn: 'Excel Aktar',
        restoreBtn: 'Geri Yükle',
        kpiTotal: 'Toplam Risk (FMEA)',
        kpiHigh: 'Yüksek Risk (RPN ≥ 100)',
        kpi8d: 'Aktif 8D Şikayet / Kayıt',
        kpiAvg: 'Ortalama RPN',
        formTitle: 'FMEA / 8D Takip Kaydı Ekle',
        phProcess: 'Süreç / Üretim Hattı (ör: Kavurma)',
        phMode: 'Hata Modu / Şikayet (8D)',
        phEffect: 'Kalite / Müşteri Etkisi',
        phAction: 'Düzeltici Faaliyet (8D / FMEA)',
        addBtn: 'Kaydı Kaydet',
        tableTitle: 'FMEA Kayıtları ve 8D Raporları',
        delBtn: 'Sil',
        sampleProcess: 'Kavurma ve Soğutma',
        sampleMode: 'Kavurma Derecesi Sapması (8D)',
        sampleEffect: 'Tat/Aroma Değişimi ve Parti Tutarsızlığı',
        sampleAction: 'Sıcaklık Sensörü Kalibrasyonu ve Parti Kontrolü'
      }
    };

    function saveStorage() {
      localStorage.setItem('coffee_fmea_8d_v1', JSON.stringify(records));
    }

    function applyLang() {
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('app-title').textContent = t.title;
      document.getElementById('engineer-sig').textContent = t.sig;
      document.getElementById('btn-lang').textContent = t.toggleBtn;
      document.getElementById('btn-export').textContent = t.exportBtn;
      document.getElementById('btn-restore').textContent = t.restoreBtn;
      document.getElementById('kpi-total-label').textContent = t.kpiTotal;
      document.getElementById('kpi-high-label').textContent = t.kpiHigh;
      document.getElementById('kpi-8d-label').textContent = t.kpi8d;
      document.getElementById('kpi-avg-label').textContent = t.kpiAvg;
      document.getElementById('form-title').textContent = t.formTitle;
      document.getElementById('f-process').placeholder = t.phProcess;
      document.getElementById('f-mode').placeholder = t.phMode;
      document.getElementById('f-effect').placeholder = t.phEffect;
      document.getElementById('f-action').placeholder = t.phAction;
      document.getElementById('btn-add').textContent = t.addBtn;
      document.getElementById('table-title').textContent = t.tableTitle;
      render();
    }

    function toggleLang() {
      lang = lang === 'ar' ? 'tr' : 'ar';
      applyLang();
    }

    function addRecord(e) {
      e.preventDefault();
      const s = Math.min(10, Math.max(1, Number(document.getElementById('f-sev').value) || 1));
      const o = Math.min(10, Math.max(1, Number(document.getElementById('f-occ').value) || 1));
      const d = Math.min(10, Math.max(1, Number(document.getElementById('f-det').value) || 1));
      const rec = {
        id: Date.now(),
        process: document.getElementById('f-process').value.trim(),
        mode: document.getElementById('f-mode').value.trim(),
        effect: document.getElementById('f-effect').value.trim(),
        s, o, d,
        rpn: s * o * d,
        action: document.getElementById('f-action').value.trim()
      };
      records.unshift(rec);
      saveStorage();
      e.target.reset();
      document.getElementById('f-sev').value = 5;
      document.getElementById('f-occ').value = 5;
      document.getElementById('f-det').value = 5;
      render();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveStorage();
      render();
    }

    function restoreSample() {
      const t = i18n[lang];
      const s = 8, o = 4, d = 4;
      records = [{
        id: Date.now(),
        process: t.sampleProcess,
        mode: t.sampleMode,
        effect: t.sampleEffect,
        s, o, d,
        rpn: s * o * d,
        action: t.sampleAction
      }];
      saveStorage();
      render();
    }

    function exportData() {
      const headers = ['#', 'Process', 'Mode / 8D', 'Effect', 'S', 'O', 'D', 'RPN', 'Action'];
      const rows = records.map((r, i) => [
        i + 1,
        `"${(r.process || '').replace(/"/g, '""')}"`,
        `"${(r.mode || '').replace(/"/g, '""')}"`,
        `"${(r.effect || '').replace(/"/g, '""')}"`,
        r.s, r.o, r.d, r.rpn,
        `"${(r.action || '').replace(/"/g, '""')}"`
      ]);
      const csv = '\uFEFF' + [headers.join(','), ...rows.map(row => row.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'coffee_fmea_8d.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function render() {
      const tbody = document.getElementById('fmea-tbody');
      const delLabel = i18n[lang].delBtn;
      tbody.innerHTML = records.map((r, idx) => {
        const badgeClass = r.rpn >= 100
          ? 'bg-red-100 text-red-700 font-bold'
          : r.rpn >= 50
            ? 'bg-amber-100 text-amber-800 font-semibold'
            : 'bg-emerald-100 text-emerald-800';
        return `
          <tr>
            <td class="p-2">${idx + 1}</td>
            <td class="p-2">${r.process}</td>
            <td class="p-2">${r.mode}</td>
            <td class="p-2">${r.effect}</td>
            <td class="p-2 text-center">${r.s}</td>
            <td class="p-2 text-center">${r.o}</td>
            <td class="p-2 text-center">${r.d}</td>
            <td class="p-2 text-center"><span class="px-2 py-1 rounded-lg text-xs ${badgeClass}">${r.rpn}</span></td>
            <td class="p-2">${r.action || '-'}</td>
            <td class="p-2 text-center">
              <button type="button" onclick="deleteRecord(${r.id})" class="text-red-600 hover:underline text-xs">${delLabel}</button>
            </td>
          </tr>
        `;
      }).join('');

      const total = records.length;
      const high = records.filter(r => r.rpn >= 100).length;
      const active8d = records.filter(r => /8d/i.test(r.mode || '') || /8d/i.test(r.action || '')).length;
      const avg = total ? Math.round(records.reduce((acc, r) => acc + r.rpn, 0) / total) : 0;

      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-high').textContent = high;
      document.getElementById('kpi-8d').textContent = active8d;
      document.getElementById('kpi-avg').textContent = avg;
    }

    applyLang();
  </script>
</body>
</html>
